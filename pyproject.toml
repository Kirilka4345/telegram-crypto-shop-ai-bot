[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-crypto-shop-bot"
version = "1.1.1"
authors = [
  { name="Kirill" },
]
description = "A Python prototype for rendering a sample digital catalog and TON payment links."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Kirilka4345/telegram-crypto-shop-ai-bot"

[tool.setuptools]
py-modules = ["bot"]
